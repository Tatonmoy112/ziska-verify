name: ziska_verify
description: "Track & Trace: Ziska Pharma product verification app for officials."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  bloc_concurrency: ^0.3.0
  clock: ^1.1.2
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_image_compress: ^2.5.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^17.5.0
  # Pinned: image >= 4.6 needs archive >= 4.1, which pdf 3.12 does not allow
  # (pdf 3.13 needs a newer Dart SDK). Unpin when pdf allows it.
  image: 4.5.4
  image_picker: ^1.2.4
  intl: 0.20.2
  json_annotation: ^4.12.0
  logger: ^2.8.0
  lucide_icons_flutter: ^4.0.3
  mobile_scanner: ^7.5.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  pdf: ^3.12.0
  permission_handler: 12.0.1
  printing: ^5.14.3
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  skeletonizer: ^3.0.0
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  http_mock_adapter: ^0.6.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  very_good_analysis: ^10.2.0

flutter:
  generate: true
  uses-material-design: true
