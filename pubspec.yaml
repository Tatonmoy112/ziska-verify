name: ziska_verify
description: "Track & Trace: Ziska Pharma product verification app for officials."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  bloc_concurrency: ^0.3.0
  clock: ^1.1.2
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_image_compress: ^2.5.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^17.5.0
  image_picker: ^1.2.4
  intl: 0.20.2
  json_annotation: ^4.12.0
  logger: ^2.8.0
  lucide_icons_flutter: ^4.0.3
  mobile_scanner: ^7.5.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  permission_handler: 12.0.1
  shared_preferences: ^2.5.6
  skeletonizer: ^3.0.0
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  http_mock_adapter: ^0.6.1
  # Pinned for the development-only QR-sheet generator (pdf 3.12).
  image: 4.5.4
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  pdf: ^3.12.0
  very_good_analysis: ^10.2.0

flutter:
  generate: true
  uses-material-design: true

# The app icon and launch screen, from the logo rendered by
# tool/app_icon/render_app_icon_test.dart. Regenerate with
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  # The foreground already keeps the logo inside the safe circle.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/icon/splash_logo.png
  fullscreen: false
